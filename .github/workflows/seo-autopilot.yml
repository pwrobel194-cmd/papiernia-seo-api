name: SEO Autopilot Papiernia

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      OPENAI_MODEL: "gpt-5.6-luna"
      AUTO_APPLY_SAFE: "false"
      MAX_CHANGES: "3"
      MIN_IMPRESSIONS: "50"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: automation/requirements-seo.txt

      - name: Install dependencies
        run: pip install -r automation/requirements-seo.txt

      - name: Run SEO autopilot
        run: python automation/seo_agent.py

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-autopilot-report
          path: reports/
          if-no-files-found: warn
          retention-days: 30
