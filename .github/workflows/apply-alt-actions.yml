name: Apply safe ALT actions

on:
  push:
    branches: [ "main" ]
    paths:
      - "automation/alt_actions.json"
      - "automation/apply_alt_actions.py"
      - ".github/workflows/apply-alt-actions.yml"

jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
      APPLY_ALT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python automation/apply_alt_actions.py
