name: Christmas SEO 2026 — five products image ALT
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/seo-swieta-five-alt-20261114.yml
      - automation/seo_swieta_five_alt_20261114.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-picture-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Preview, commit and read back 5 product image ALT/Title
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/seo_swieta_five_alt_20261114.py
      - name: Upload backup and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papiernia-seo-swieta-five-alt-20261114
          path: reports/christmas-five-alt-20261114/
          if-no-files-found: warn
          retention-days: 14
