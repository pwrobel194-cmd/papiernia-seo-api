name: Chrzest SEO stage 1 - PREVIEW ONLY
on:
  push:
    branches: [seo/chrzest-20261109-stage1]
    paths:
      - automation/chrzest_stage1_20261109.py
      - .github/workflows/chrzest-stage1-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
      SEO_MODE: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Test live snapshots and preview each change, no writes
        run: python automation/chrzest_stage1_20261109.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrzest-seo-stage1-preview
          path: audit/chrzest-20261109/
          retention-days: 14
          if-no-files-found: warn
