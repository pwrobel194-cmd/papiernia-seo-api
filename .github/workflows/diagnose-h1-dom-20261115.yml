name: H1 markup diagnostic (read only)
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/diagnose-h1-dom-20261115.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect public markup
        run: python automation/diagnose_h1_dom_20261115.py
      - name: Store exact HTML H1 context report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f automation/reports/ahrefs-h1-dom-20261115.json; then
            git add automation/reports/ahrefs-h1-dom-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Record markup context for duplicated H1"
              git push origin HEAD:main
            fi
          fi
