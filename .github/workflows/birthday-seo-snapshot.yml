name: Birthday SEO read-only snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Fetch category data read-only
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/birthday_seo_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: birthday-seo-snapshot
          path: birthday-seo-snapshot/
          retention-days: 7
