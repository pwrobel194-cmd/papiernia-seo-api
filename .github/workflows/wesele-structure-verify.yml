name: Wedding SEO architecture - post-deployment public verification
on:
  push:
    branches: [seo/wesele-struktura-20261111]
    paths:
      - '.github/workflows/wesele-structure-verify.yml'
      - 'automation/wesele_structure_verify.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5 beautifulsoup4==4.12.3
      - name: Refresh live category and product snapshots
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/wesele_structure_snapshot.py
      - name: Check canonical, HTTP 200 and added HTML sections publicly
        run: python automation/wesele_structure_verify.py
      - name: Archive verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wesele-structure-public-verification
          path: reports/wesele-structure/
          retention-days: 30
