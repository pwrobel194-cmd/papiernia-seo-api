name: One-time Ahrefs broken links repair 2026-11-15

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-ahrefs-20261115.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safely correct only three approved HTML href placeholders through SEO API v3
        id: repair
        continue-on-error: true
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/repair_ahrefs_links_20261115.py
      - name: Diagnose live page and API snapshot without changing the shop
        if: always()
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          report = Path('automation/reports/ahrefs-links-20261115.json')
          data = json.loads(report.read_text(encoding='utf-8')) if report.exists() else {}
          url = 'https://papiernia.net.pl/zlota-torebka-z-cukierkami-na-swieta-personalizowana-etykieta'
          def get(target, auth=False):
              headers={'User-Agent':'Mozilla/5.0 (compatible; SEO-audit/1.0)'}
              if auth: headers['X-Papiernia-SEO-Key']=os.environ['PAPIERNIA_SEO_API_KEY']
              req=urllib.request.Request(target, headers=headers)
              with urllib.request.urlopen(req,timeout=35) as resp: return resp.read().decode('utf-8','replace')
          try:
              source=get(url)
              data['live_page_placeholders']=sorted(set(re.findall(r'URL_ZDJECIA[123]',source,re.I)))
              data['live_page_placeholder_count']=len(re.findall(r'URL_ZDJECIA[123]',source,re.I))
              data['live_page_example_context']=[source[max(0,m.start()-95):m.end()+95] for m in list(re.finditer(r'URL_ZDJECIA[123]',source,re.I))[:3]]
          except Exception as exc: data['live_page_error']=str(exc)[:300]
          try:
              source=get('https://papiernia.net.pl/papiernia-seo-api/v3/ProductSnapshot/4970',True)
              snapshot=json.loads(source)
              paths=[]
              def scan(obj,path='root'):
                  if isinstance(obj,dict):
                      for key,v in obj.items(): scan(v,path+'.'+key)
                  elif isinstance(obj,list):
                      for i,v in enumerate(obj): scan(v,path+'['+str(i)+']')
                  elif isinstance(obj,str) and 'URL_ZDJECIA' in obj:
                      paths.append({'field':path,'count':len(re.findall(r'URL_ZDJECIA[123]',obj,re.I))})
              scan(snapshot)
              data['api_snapshot_fields_with_placeholders']=paths
          except Exception as exc: data['api_snapshot_error']=str(exc)[:300]
          report.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Store non-sensitive verification report in repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f automation/reports/ahrefs-links-20261115.json; then
            git add automation/reports/ahrefs-links-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Report one-time Ahrefs link repair verification"
              git push origin HEAD:main
            fi
          else
            echo "No report generated"
          fi
      - name: Mark operation failed if API write was not verified
        if: steps.repair.outcome != 'success'
        run: exit 1
