name: One-time Ahrefs broken links repair 2026-11-15

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/repair-ahrefs-20261115.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Safely correct only three approved HTML href placeholders through SEO API v3
        id: repair
        continue-on-error: true
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/repair_ahrefs_links_20261115.py
      - name: Store non-sensitive verification report in repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f automation/reports/ahrefs-links-20261115.json; then
            git add automation/reports/ahrefs-links-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Report one-time Ahrefs link repair verification"
              git push origin HEAD:main
            fi
          else
            echo "No report generated"
          fi
      - name: Mark operation failed if API write was not verified
        if: steps.repair.outcome != 'success'
        run: exit 1
