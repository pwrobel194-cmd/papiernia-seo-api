name: Chrzest SEO stage 1 - Guarded production deploy
on:
  push:
    branches: [seo/chrzest-20261108-stage1]
    paths: [.github/workflows/chrzest-stage1-deploy.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
      SEO_MODE: apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Verify source fingerprints and perform guarded Preview-Commit-GET
        run: python automation/chrzest_seo_stage1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrzest-seo-stage1-deployment-verification
          path: audit/chrzest-stage1/applied.json
          if-no-files-found: warn
          retention-days: 30
