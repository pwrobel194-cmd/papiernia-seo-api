name: Read lizaki swiateczne

on:
  push:
    branches: [ "main" ]
    paths:
      - "automation/read_lizaki_swiateczne.py"
      - ".github/workflows/read-lizaki-swiateczne.yml"

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python automation/read_lizaki_swiateczne.py
      - uses: actions/upload-artifact@v4
        with:
          name: lizaki-swiateczne-before
          path: reports/lizaki-swiateczne-before.*
          retention-days: 30
