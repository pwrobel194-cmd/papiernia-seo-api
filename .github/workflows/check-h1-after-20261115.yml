name: Verify H1 after Quick Tabs change
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-h1-after-20261115.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current live H1 across 27 product pages
        run: python automation/check_h1_after_20261115.py
      - name: Save read-only result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/reports/ahrefs-h1-after-fix-20261115.json
          if ! git diff --cached --quiet; then
            git commit -m "Record live verification of product H1 after manual fix"
            git push origin HEAD:main
          fi
