name: Read-only H1 source audit for Ahrefs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-h1-20261115.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compare rendered H1 with existing API HTML (read-only)
        id: audit
        continue-on-error: true
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/audit_h1_20261115.py
      - name: Persist audit report
        if: always()
        run: |
          if test -f automation/reports/ahrefs-h1-20261115.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add automation/reports/ahrefs-h1-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Record read-only H1 source audit"
              git push origin HEAD:main
            fi
          fi
      - name: Ensure audit completed
        if: steps.audit.outcome != 'success'
        run: exit 1
