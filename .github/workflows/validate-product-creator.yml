name: Validate Product Creator v0.4

on:
  push:
    branches: [ "feature/product-creator-v04" ]
    paths:
      - "src/**"
      - "automation/upload_reconcile.py"
      - "automation/test_upload_reconcile.py"
      - ".github/workflows/validate-product-creator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test ambiguous WebP upload handling
        run: python -m unittest discover -s automation -p 'test_upload_reconcile.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout nopCommerce 4.50.3
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: release-4.50.3
          path: nopcommerce
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Copy plugin
        run: |
          rm -rf nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi
          cp -R src/Nop.Plugin.Misc.PapierniaSeoApi nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi
      - name: Compile against nopCommerce 4.50.3
        run: dotnet build nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi/Nop.Plugin.Misc.PapierniaSeoApi.csproj -c Release --nologo
