name: Guarded one-time category H1 fix and topic audit
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/fix-category-h1-20261115.yml", "automation/repair_h1_category_topics_20261115.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit_and_repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check category and apply only exact approved H1-to-H2 via SEO API v3
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/repair_h1_category_topics_20261115.py
      - name: Persist non-sensitive report with full changes status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f automation/reports/ahrefs-h1-remediation-20261115.json; then
            git add automation/reports/ahrefs-h1-remediation-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Record category H1 repair and 9 topic check"
              git push origin HEAD:main
            fi
          fi
