name: Inspect picture ALTs

on:
  push:
    branches: [ "main" ]
    paths:
      - "automation/inspect_picture_alts.py"
      - ".github/workflows/inspect-picture-alts.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python automation/inspect_picture_alts.py
