name: Build nopCommerce plugin

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build-plugin.yml"
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - ".github/workflows/build-plugin.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Checkout nopCommerce 4.50.3
        uses: actions/checkout@v4
        with:
          repository: nopSolutions/nopCommerce
          ref: release-4.50.3
          path: nopcommerce
          fetch-depth: 1

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Copy plugin into nopCommerce source
        run: |
          rm -rf nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi
          cp -R src/Nop.Plugin.Misc.PapierniaSeoApi nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi

      - name: Build plugin
        run: |
          dotnet build nopcommerce/src/Plugins/Nop.Plugin.Misc.PapierniaSeoApi/Nop.Plugin.Misc.PapierniaSeoApi.csproj -c Release

      - name: Validate package contents
        run: |
          PLUGIN="nopcommerce/src/Presentation/Nop.Web/Plugins/Misc.PapierniaSeoApi"
          test -f "$PLUGIN/Nop.Plugin.Misc.PapierniaSeoApi.dll"
          test -f "$PLUGIN/plugin.json"
          find "$PLUGIN" -maxdepth 2 -type f -print

      - name: Package plugin
        run: |
          mkdir -p dist
          cd nopcommerce/src/Presentation/Nop.Web/Plugins
          # Plugin ZIP must not include host assemblies, debug PDBs, or refs/.
          # Keep exact single-root directory layout required by nopCommerce 4.50 upload.
          zip -9 "${{ github.workspace }}/dist/PapierniaSeoApi-nopCommerce-4.50.3-v3.0.zip" \
            Misc.PapierniaSeoApi/plugin.json \
            Misc.PapierniaSeoApi/Nop.Plugin.Misc.PapierniaSeoApi.dll \
            Misc.PapierniaSeoApi/Nop.Plugin.Misc.PapierniaSeoApi.deps.json
          unzip -l "${{ github.workspace }}/dist/PapierniaSeoApi-nopCommerce-4.50.3-v3.0.zip"
          test $(unzip -Z1 "${{ github.workspace }}/dist/PapierniaSeoApi-nopCommerce-4.50.3-v3.0.zip" | wc -l) -eq 3

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PapierniaSeoApi-nopCommerce-4.50.3-v3.0
          path: dist/PapierniaSeoApi-nopCommerce-4.50.3-v3.0.zip
          if-no-files-found: error
          retention-days: 14
