name: Wedding SEO structure - read only audit
on:
  push:
    branches: [seo/wesele-struktura-20261111]
    paths:
      - 'automation/wesele_structure_snapshot.py'
      - '.github/workflows/wesele-structure-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.32.5 beautifulsoup4==4.12.3
      - name: Read wedding categories and all visible products via API
        env:
          PAPIERNIA_SEO_API_KEY: ${{ secrets.PAPIERNIA_SEO_API_KEY }}
        run: python automation/wesele_structure_snapshot.py
      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wesele-structure-snapshot
          path: reports/wesele-structure/
          retention-days: 30
