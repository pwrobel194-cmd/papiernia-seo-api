name: Verify lizaki swiateczne public page

on:
  push:
    branches: [ "main" ]
    paths:
      - "automation/verify_lizaki_public.py"
      - ".github/workflows/verify-lizaki-public.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.5
      - run: python automation/verify_lizaki_public.py
