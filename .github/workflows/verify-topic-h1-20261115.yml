name: One-time verification of 9 topic H1 fixes
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/verify-topic-h1-20261115.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public H1 and H2 of all nine pages
        run: python automation/verify_topic_h1_20261115.py
      - name: Save read-only verification report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f automation/reports/ahrefs-topic-h1-verified-20261115.json; then
            git add automation/reports/ahrefs-topic-h1-verified-20261115.json
            if ! git diff --cached --quiet; then
              git commit -m "Record verified H1 status after manual topic edits"
              git push origin HEAD:main
            fi
          fi
